<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MN Electronics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary-grad: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .brand-header { margin-bottom: 30px; animation: fadeInDown 0.8s ease-out; }
        .brand-name {
            font-size: 38px; font-weight: 900; text-transform: uppercase;
            background: linear-gradient(to right, #2563eb, #d946ef);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0; letter-spacing: 1px;
            text-shadow: 0px 5px 15px rgba(37, 99, 235, 0.2);
        }
        .brand-subtitle { font-size: 14px; color: #6b7280; letter-spacing: 4px; margin-top: 5px; font-weight: bold; }

        .screen {
            background: var(--card-bg); padding: 30px; border-radius: 25px;
            box-shadow: var(--shadow); width: 100%; max-width: 450px;
            display: none; animation: fadeInUp 0.5s ease-out; box-sizing: border-box;
        }
        #login-screen {
            display: block;
            background: url('photo_2026-08-06_15-09-35.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
        }
        #login-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            z-index: 0;
        }
        #login-screen > * {
            position: relative;
            z-index: 1;
        }

        input {
            width: 100%; padding: 18px; margin: 25px 0;
            border: 2px solid #e5e7eb; border-radius: 15px;
            font-size: 20px; text-align: center; font-weight: bold;
            text-transform: uppercase; background: #f9fafb;
        }
        input:focus { border-color: #2563eb; outline: none; background: #fff; }

        .btn-main {
            width: 100%; padding: 16px; background: var(--primary-grad);
            color: white; border: none; border-radius: 15px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.98); }

        .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .model-btn {
            background: white; border: 2px solid #e5e7eb; padding: 15px;
            border-radius: 15px; font-size: 16px; font-weight: bold;
            cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s;
        }
        .model-btn:active { background: #eff6ff; border-color: #2563eb; transform: scale(0.95); }
        .model-btn i { font-size: 24px; color: #2563eb; }

        .control-grid { display: grid; gap: 12px; margin-top: 15px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-4 { grid-template-columns: 1fr 1fr; }
        .grid-8 { grid-template-columns: repeat(3, 1fr); }
        .grid-16 { grid-template-columns: repeat(4, 1fr); }

        .relay-card {
            background: #f8fafc; padding: 15px 5px; border-radius: 15px;
            border: 1px solid #edf2f7; text-align: center;
            transition: 0.2s; position: relative;
        }

        .relay-title { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px; display: block; }
        
        .toggle-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 22px; transition: all 0.15s ease-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: center; margin: 0 auto;
        }
        
        .is-on .toggle-btn { 
            background: #10b981; color: white; 
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); 
            transform: scale(1.05);
        }
        .is-off .toggle-btn { background: #e2e8f0; color: #94a3b8; }
        
        .status-text { font-size: 12px; font-weight: bold; margin-top: 8px; display: block; }
        .is-on .status-text { color: #10b981; }
        .is-off .status-text { color: #94a3b8; }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex; gap: 8px; margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;
        }
        .nav-tab {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            background: #f3f4f6; color: #6b7280; font-weight: bold;
            cursor: pointer; font-family: 'Tajawal'; font-size: 14px;
            transition: 0.2s;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, #2563eb, #d946ef);
            color: white;
        }
        .nav-tab:active { transform: scale(0.97); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Timer Form */
        .timer-form {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 15px; text-align: right;
        }
        .timer-form label {
            font-size: 12px; color: #64748b; margin-bottom: 4px; display: block;
        }
        .timer-form input, .timer-form select {
            width: 100%; padding: 10px; border: 2px solid #e5e7eb;
            border-radius: 10px; font-family: 'Tajawal'; font-size: 14px;
            box-sizing: border-box;
        }
        .timer-form input:focus, .timer-form select:focus {
            border-color: #2563eb; outline: none;
        }

        /* Days Checkboxes */
        .days-check {
            display: flex; gap: 6px; flex-wrap: wrap;
            justify-content: center; margin: 10px 0;
        }
        .day-box {
            padding: 6px 10px; border-radius: 8px;
            border: 2px solid #e5e7eb; background: white;
            cursor: pointer; font-size: 12px; font-weight: bold;
            transition: 0.2s;
        }
        .day-box.selected {
            background: #2563eb; color: white; border-color: #2563eb;
        }

        /* Timer List */
        .timer-row {
            display: flex; align-items: center; gap: 10px;
            background: #f8fafc; padding: 12px; border-radius: 12px;
            margin-bottom: 8px; border: 1px solid #edf2f7; text-align: right;
        }
        .timer-row .t-info { flex: 1; font-size: 13px; }
        .timer-row .t-info b { color: #1f2937; }
        .timer-row .t-status {
            font-size: 11px; padding: 4px 10px; border-radius: 8px; font-weight: bold;
        }
        .t-active { background: #d1fae5; color: #065f46; }
        .t-inactive { background: #fee2e2; color: #991b1b; }

        .btn-small {
            padding: 6px 12px; border: none; border-radius: 8px;
            font-size: 12px; font-weight: bold; cursor: pointer;
            color: white; font-family: 'Tajawal';
        }
        .btn-del { background: #ef4444; }
        .btn-toggle { background: #2563eb; }
        .btn-add {
            width: 100%; padding: 14px; border: none; border-radius: 15px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #d946ef);
            color: white; font-family: 'Tajawal'; margin-top: 10px;
        }

        /* All Controls */
        .all-controls {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-bottom: 20px; max-width: 400px;
            margin: 0 auto 20px;
        }
        .all-btn {
            padding: 12px; border: none; border-radius: 15px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            color: white; font-family: 'Tajawal';
        }
        .all-on { background: linear-gradient(135deg, #10b981, #059669); }
        .all-off { background: linear-gradient(135deg, #ef4444, #dc2626); }

        @media (max-width: 400px) {
            .grid-8 { grid-template-columns: 1fr 1fr; }
            .grid-16 { grid-template-columns: repeat(3, 1fr); }
            .brand-name { font-size: 28px; }
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1 class="brand-name">MN ELECTRONICS</h1>
        <div class="brand-subtitle">SMART CONTROL SYSTEMS</div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen">
        <h3>تسجيل الدخول</h3>
        <p style="color:#9ca3af;">أدخل الكود التسلسلي للجهاز</p>
        <input type="text" id="devCode" placeholder="MN-XXXXXX" maxlength="15">
        <button class="btn-main" onclick="verifyCode()">تــــابــــع</button>
    </div>

    <!-- شاشة اختيار الموديل -->
    <div id="select-screen" class="screen">
        <h3>اختر نوع الجهاز</h3>
        <div class="model-grid">
            <button class="model-btn" onclick="selectModel(2)">
                <i class="fas fa-toggle-on"></i> <span>2 خط (2CH)</span>
            </button>
            <button class="model-btn" onclick="selectModel(4)">
                <i class="fas fa-th-large"></i> <span>4 خطوط (4CH)</span>
            </button>
            <button class="model-btn" onclick="selectModel(8)">
                <i class="fas fa-th"></i> <span>8 خطوط (8CH)</span>
            </button>
            <button class="model-btn" onclick="selectModel(16)">
                <i class="fas fa-cubes"></i> <span>16 خط (16CH)</span>
            </button>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="dashboard" class="screen" style="max-width: 800px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
            <div><span style="font-size:12px; color:#999;">ID:</span> <span id="dispCode" style="color:#2563eb; font-weight:bold;">...</span></div>
            <div onclick="logout()" style="color:#ef4444; cursor:pointer; font-size:14px;"><i class="fas fa-sign-out-alt"></i> خروج</div>
        </div>

        <!-- التبويبات -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showTab('control',this)">⚡ التحكم</button>
            <button class="nav-tab" onclick="showTab('timers',this)">⏰ التايمرات</button>
        </div>

        <!-- تاب التحكم -->
        <div id="tab-control" class="tab-content active">
            <div class="all-controls">
                <button class="all-btn all-on" onclick="setAll(1)"><i class="fas fa-power-off"></i> تشغيل الكل</button>
                <button class="all-btn all-off" onclick="setAll(0)"><i class="fas fa-times"></i> إيقاف الكل</button>
            </div>
            <div id="buttons-container" class="control-grid"></div>
        </div>

        <!-- تاب التايمرات -->
        <div id="tab-timers" class="tab-content">
            <h3 style="margin:0 0 15px; color:#1f2937;">إضافة تايمر جديد</h3>
            <div class="timer-form">
                <div>
                    <label>الريليه</label>
                    <select id="tRelay"></select>
                </div>
                <div>
                    <label>التفعيل</label>
                    <select id="tEnabled">
                        <option value="1">مفعل</option>
                        <option value="0">معطل</option>
                    </select>
                </div>
                <div>
                    <label>وقت التشغيل</label>
                    <input type="time" id="tOnTime" value="08:00">
                </div>
                <div>
                    <label>وقت الإطفاء</label>
                    <input type="time" id="tOffTime" value="18:00">
                </div>
            </div>
            
            <div style="text-align:center; margin-bottom:10px;">
                <label style="font-size:13px; color:#64748b; font-weight:bold;">أيام التشغيل</label>
            </div>
            <div class="days-check" id="daysCheck">
                <div class="day-box" data-day="0">سب</div>
                <div class="day-box" data-day="1">أح</div>
                <div class="day-box" data-day="2">اث</div>
                <div class="day-box" data-day="3">ثل</div>
                <div class="day-box" data-day="4">أر</div>
                <div class="day-box" data-day="5">خم</div>
                <div class="day-box" data-day="6">جم</div>
            </div>
            
            <button class="btn-add" onclick="addTimer()">
                <i class="fas fa-plus"></i> إضافة تايمر
            </button>

            <div style="margin-top:25px; border-top:2px solid #e5e7eb; padding-top:20px;">
                <h3 style="margin:0 0 15px; color:#1f2937;">التايمرات الحالية</h3>
                <div id="timersList">
                    <div style="color:#999; padding:20px;">جاري التحميل...</div>
                </div>
            </div>
        </div>
    </div>

<script>
    // إعدادات فايربيس
    const firebaseConfig = {
        databaseURL: "https://mn-pro-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myDeviceID = "";
    let relayCount = 16;
    let relayStates = new Array(16).fill(0);
    let selectedDays = new Set();
    let currentTimers = [];

    // عند التحميل
    window.onload = function() {
        const savedID = localStorage.getItem("mn_device_sn");
        const savedCount = localStorage.getItem("mn_relay_count");
        if(savedID) {
            document.getElementById('devCode').value = savedID;
            myDeviceID = savedID;
            if(savedCount) selectModel(parseInt(savedCount), true);
            else goToSelectScreen();
        }
        
        // تهيئة اختيار الأيام
        document.querySelectorAll('.day-box').forEach(function(box) {
            box.addEventListener('click', function() {
                var d = parseInt(this.dataset.day);
                if(selectedDays.has(d)) {
                    selectedDays.delete(d);
                    this.classList.remove('selected');
                } else {
                    selectedDays.add(d);
                    this.classList.add('selected');
                }
            });
        });
    };

    function verifyCode() {
        const code = document.getElementById('devCode').value.trim().toUpperCase();
        if(code.length < 5) return alert("الرجاء إدخال كود صحيح");
        myDeviceID = code;
        localStorage.setItem("mn_device_sn", myDeviceID);
        goToSelectScreen();
    }

    function goToSelectScreen() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('select-screen').style.display = 'block';
    }

    function selectModel(count, skipSave = false) {
        if(!skipSave) localStorage.setItem("mn_relay_count", count);
        relayCount = count;

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('select-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('dispCode').innerText = myDeviceID;

        // تحديث خيارات الريليه في نموذج التايمر
        updateRelaySelect();

        const container = document.getElementById('buttons-container');
        container.className = 'control-grid';
        if(count === 2) container.classList.add('grid-2');
        else if(count === 4) container.classList.add('grid-4');
        else if(count === 8) container.classList.add('grid-8');
        else if(count === 16) container.classList.add('grid-16');

        generateButtons(count);
        loadTimers();
    }

    function updateRelaySelect() {
        const select = document.getElementById('tRelay');
        select.innerHTML = '';
        for(let i = 0; i < relayCount; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = 'جهاز ' + (i + 1);
            select.appendChild(option);
        }
    }

    function logout() {
        localStorage.removeItem("mn_device_sn");
        localStorage.removeItem("mn_relay_count");
        location.reload();
    }

    function showTab(tabName, btn) {
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(x => x.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        btn.classList.add('active');
        
        if(tabName === 'timers') loadTimers();
    }

    function generateButtons(count) {
        const container = document.getElementById('buttons-container');
        container.innerHTML = "";
        for(let i = 0; i < count; i++) {
            container.innerHTML += `
                <div class="relay-card is-off" id="card-${i}">
                    <span class="relay-title">جهاز ${i+1}</span>
                    <button class="toggle-btn" onclick="toggleRelay(${i})">
                        <i class="fas fa-power-off"></i>
                    </button>
                    <span class="status-text" id="txt-${i}">مطفأ</span>
                </div>`;
            listenToRelay(i);
        }
    }

    function listenToRelay(i) {
        db.ref('devices/' + myDeviceID + '/r' + i).on('value', (snap) => {
            const val = snap.val();
            const card = document.getElementById('card-' + i);
            const txt = document.getElementById('txt-' + i);
            
            if(!card || !txt) return;
            
            if(val == 1) { 
                card.className = "relay-card is-on";
                txt.innerText = "يعمل";
                relayStates[i] = 1;
            } else {
                card.className = "relay-card is-off";
                txt.innerText = "مطفأ";
                relayStates[i] = 0;
            }
        });
    }

    function toggleRelay(i) {
        const ref = db.ref('devices/' + myDeviceID + '/r' + i);
        ref.once('value', (snap) => {
            const current = snap.val() || 0;
            ref.set(current == 1 ? 0 : 1);
        });
    }

    function setAll(state) {
        for(let i = 0; i < relayCount; i++) {
            db.ref('devices/' + myDeviceID + '/r' + i).set(state);
        }
    }

    // ================= دوال التايمرات =================

    function addTimer() {
        const relay = parseInt(document.getElementById('tRelay').value);
        const onTime = document.getElementById('tOnTime').value;
        const offTime = document.getElementById('tOffTime').value;
        const enabled = document.getElementById('tEnabled').value === '1';

        if(selectedDays.size === 0) {
            alert('اختر يوماً واحداً على الأقل');
            return;
        }

        // حساب bitmask للأيام
        let daysMask = 0;
        selectedDays.forEach(d => daysMask |= (1 << d));

        // إنشاء التايمر
        const timer = {
            relay: relay,
            onTime: onTime,
            offTime: offTime,
            days: daysMask,
            enabled: enabled,
            createdAt: Date.now()
        };

        // حفظ في Firebase
        const timerRef = db.ref('devices/' + myDeviceID + '/timers').push();
        timerRef.set(timer)
            .then(() => {
                alert('تمت الإضافة بنجاح ✅');
                loadTimers();
                // إعادة تعيين النموذج
                document.getElementById('tOnTime').value = '08:00';
                document.getElementById('tOffTime').value = '18:00';
                selectedDays.clear();
                document.querySelectorAll('.day-box').forEach(box => box.classList.remove('selected'));
            })
            .catch(err => {
                alert('فشل الإضافة');
                console.error(err);
            });
    }

    function loadTimers() {
        const list = document.getElementById('timersList');
        if(!list) return;

        db.ref('devices/' + myDeviceID + '/timers').on('value', (snap) => {
            currentTimers = [];
            snap.forEach(child => {
                currentTimers.push({
                    id: child.key,
                    ...child.val()
                });
            });

            if(currentTimers.length === 0) {
                list.innerHTML = '<div style="color:#999; padding:20px;">لا توجد تايمرات</div>';
                return;
            }

            list.innerHTML = currentTimers.map((t, i) => {
                const daysText = getDayNames(t.days);
                const statusClass = t.enabled ? 't-active' : 't-inactive';
                const statusText = t.enabled ? 'مفعل' : 'معطل';
                const toggleText = t.enabled ? 'تعطيل' : 'تفعيل';

                return `
                    <div class="timer-row">
                        <div class="t-info">
                            <div><b>جهاز ${(t.relay || 0) + 1}</b> — ${t.onTime} → ${t.offTime}</div>
                            <div style="font-size:11px; color:#999; margin-top:4px;">${daysText}</div>
                        </div>
                        <span class="t-status ${statusClass}">${statusText}</span>
                        <button class="btn-small btn-toggle" onclick="toggleTimer('${t.id}', ${!t.enabled})">${toggleText}</button>
                        <button class="btn-small btn-del" onclick="delTimer('${t.id}')">حذف</button>
                    </div>`;
            }).join('');
        });
    }

    function getDayNames(daysMask) {
        const dayNames = ['سب', 'أح', 'اث', 'ثل', 'أر', 'خم', 'جم'];
        let result = [];
        for(let i = 0; i < 7; i++) {
            if(daysMask & (1 << i)) {
                result.push(dayNames[i]);
            }
        }
        return result.length > 0 ? result.join('، ') : '—';
    }

    function delTimer(id) {
        if(!confirm('حذف التايمر؟')) return;
        
        db.ref('devices/' + myDeviceID + '/timers/' + id).remove()
            .then(() => loadTimers())
            .catch(err => {
                alert('فشل الحذف');
                console.error(err);
            });
    }

    function toggleTimer(id, newState) {
        db.ref('devices/' + myDeviceID + '/timers/' + id + '/enabled').set(newState)
            .then(() => loadTimers())
            .catch(err => {
                alert('فشل التعديل');
                console.error(err);
            });
    }

    // ================= تنفيذ التايمرات (على ESP32) =================
    // ملاحظة: التايمرات يتم تنفيذها من ESP32 نفسه
    // هذا الكود يقرأ التايمرات من Firebase وينفذها
    
    function checkAndExecuteTimers() {
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const currentDay = now.getDay(); // 0=الأحد, 6=السبت
        
        // تحويل يوم الأسبوع ليتناسب مع bitmask
        // bitmask: 0=السبت, 1=الأحد, ..., 6=الجمعة
        const dayIndex = (currentDay + 1) % 7;
        
        currentTimers.forEach(timer => {
            if(!timer.enabled) return;
            
            // التحقق من تطابق اليوم
            if(!(timer.days & (1 << dayIndex))) return;
            
            // تحويل الأوقات لدقائق
            const currentTime = currentHour * 60 + currentMinute;
            const [onH, onM] = timer.onTime.split(':').map(Number);
            const [offH, offM] = timer.offTime.split(':').map(Number);
            const onTime = onH * 60 + onM;
            const offTime = offH * 60 + offM;
            
            // حساب ما إذا كان يجب التشغيل
            let shouldBeOn = false;
            if(onTime < offTime) {
                shouldBeOn = (currentTime >= onTime && currentTime < offTime);
            } else {
                // تجاوز منتصف الليل
                shouldBeOn = (currentTime >= onTime || currentTime < offTime);
            }
            
            // تنفيذ التغيير
            const relayRef = db.ref('devices/' + myDeviceID + '/r' + timer.relay);
            relayRef.once('value', (snap) => {
                const currentState = snap.val() || 0;
                if(shouldBeOn && currentState === 0) {
                    relayRef.set(1);
                } else if(!shouldBeOn && currentState === 1) {
                    relayRef.set(0);
                }
            });
        });
    }

    // فحص التايمرات كل 30 ثانية
    setInterval(checkAndExecuteTimers, 30000);
    
    // تشغيل فوري عند التحميل
    setTimeout(checkAndExecuteTimers, 5000);
</script>
